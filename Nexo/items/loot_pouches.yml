vip_7d:
    itemname: '<#9fce50>VIP Rank<white> (7 Days)'
    material: FEATHER
    lore:
      - '<white>Grants access to <#9fce50>VIP Rank'
      - '<white>for a period of 7 days.'
      - ''
      - '<white><glyph:rc> ʀɪɢʜᴛ-ᴄʟɪᴄᴋ ᴛᴏ ʀᴇᴅᴇᴇᴍ'
    Pack:
      texture: nitro_item/colors/green
    Mechanics:
        custom:
          grant_vip_7d:
            one_usage: true
            event: "CLICK:right:all"
            conditions:
              - '!#player.hasPermission("hasvip")'
            actions:
              - "[console] lp user <player> parent addtemp vip 7d"
