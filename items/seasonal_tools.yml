  material: NETHERITE_SHOVEL
  Enchantments:
    efficiency: 6
    unbreaking: 4
    mending: 1
    excellentenchants:telekinesis: 1
    excellentenchants:haste: 3
  lore:
  - ''
  - <#9b59b6>Dug one too many
  - <#9b59b6>graves it shouldn't have.
  Pack:
    parent_model: item/handheld
    texture: spooky/spooky_shovel

spooky_axe:
  itemname: <color:#d4935f>Spooky Axe
  material: NETHERITE_AXE
  Enchantments:
    efficiency: 6
    unbreaking: 4
    mending: 1
    excellentenchants:treefeller: 1
    excellentenchants:haste: 3
