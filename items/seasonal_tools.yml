# ============ SPOOKY ============
spooky_pickaxe:
  itemname: <color:#d4935f>Spooky Pickaxe
  material: NETHERITE_PICKAXE
  Enchantments:
    efficiency: 6
    unbreaking: 4
    mending: 1
    excellentenchants:blast_mining: 5
    excellentenchants:telekinesis: 1
    excellentenchants:haste: 3
