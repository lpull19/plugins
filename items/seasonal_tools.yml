    parent_model: item/handheld
    texture: spooky/spooky_axe

spooky_hoe:
  itemname: <color:#d4935f>Spooky Hoe
  material: NETHERITE_HOE
  Enchantments:
    efficiency: 6
    unbreaking: 4
    mending: 1
    excellentenchants:replanter: 1
    excellentenchants:telekinesis: 1
    excellentenchants:haste: 3
  lore:
  - ''
  - <#9b59b6>Tills soil that never
  - <#9b59b6>quite stays turned.
  Pack:
    parent_model: item/handheld
    texture: spooky/spooky_hoe

spooky_bow:
  itemname: <color:#d4935f>Spooky Bow
  material: BOW
  Enchantments:
    power: 6
    punch: 3
